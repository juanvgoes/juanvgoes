  <text x="26" y="117.0" class="ascii-line" style="animation-delay: 0.08s" xml:space="preserve">                <tspan fill="#f8f8f2">-</tspan><tspan fill="#bd93f9">*</tspan><tspan fill="#6272a4">@@@@@@@@@@@@%</tspan><tspan fill="#bd93f9">*</tspan><tspan fill="#f8f8f2">-</tspan>           </text>
  <text x="26" y="132.5" class="ascii-line" style="animation-delay: 0.12s" xml:space="preserve">              <tspan fill="#f8f8f2">:</tspan><tspan fill="#6272a4">%@@@@@@@@@@@@@@@@@%</tspan><tspan fill="#d6b4fc">+</tspan>         </text>
