  <text x="26" y="303.0" class="ascii-line" style="animation-delay: 0.56s" xml:space="preserve">               <tspan fill="#f8f8f2">-</tspan><tspan fill="#d6b4fc">==+</tspan><tspan fill="#bd93f9">**</tspan><tspan fill="#d6b4fc">++</tspan><tspan fill="#bd93f9">*</tspan><tspan fill="#d6b4fc">+++===+</tspan><tspan fill="#bd93f9">**#%#</tspan><tspan fill="#f8f8f2">----::::</tspan></text>
