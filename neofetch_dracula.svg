  <text x="26" y="179.0" class="ascii-line" style="animation-delay: 0.24s" xml:space="preserve">             <tspan fill="#6272a4">@</tspan><tspan fill="#d6b4fc">+</tspan><tspan fill="#f8f8f2">---::::::--</tspan><tspan fill="#d6b4fc">==+++</tspan><tspan fill="#bd93f9">*#</tspan><tspan fill="#6272a4">@@@@</tspan><tspan fill="#bd93f9">#</tspan>      </text>
  <text x="26" y="194.5" class="ascii-line" style="animation-delay: 0.28s" xml:space="preserve">            <tspan fill="#f8f8f2">:</tspan><tspan fill="#6272a4">%</tspan><tspan fill="#d6b4fc">====</tspan><tspan fill="#f8f8f2">--:::</tspan><tspan fill="#d6b4fc">=+</tspan><tspan fill="#bd93f9">*#</tspan><tspan fill="#6272a4">%%%%%</tspan><tspan fill="#bd93f9">#</tspan><tspan fill="#6272a4">%@@@%</tspan><tspan fill="#f8f8f2">:</tspan>     </text>
  <text x="26" y="210.0" class="ascii-line" style="animation-delay: 0.32s" xml:space="preserve">             <tspan fill="#bd93f9">##</tspan><tspan fill="#6272a4">@@%%%</tspan><tspan fill="#bd93f9">*</tspan><tspan fill="#f8f8f2">--</tspan><tspan fill="#bd93f9">*</tspan><tspan fill="#6272a4">@@%%@@@%</tspan><tspan fill="#bd93f9">##</tspan><tspan fill="#6272a4">@@@@</tspan><tspan fill="#f8f8f2">-::</tspan>   </text>
  <text x="26" y="225.5" class="ascii-line" style="animation-delay: 0.36s" xml:space="preserve">             <tspan fill="#d6b4fc">=</tspan><tspan fill="#6272a4">%%%%@%</tspan><tspan fill="#bd93f9">#</tspan><tspan fill="#d6b4fc">==+</tspan><tspan fill="#bd93f9">##**##*</tspan><tspan fill="#d6b4fc">++</tspan><tspan fill="#bd93f9">*#</tspan><tspan fill="#6272a4">@@</tspan><tspan fill="#bd93f9">%*</tspan><tspan fill="#d6b4fc">=</tspan><tspan fill="#f8f8f2">::</tspan>  </text>
  <text x="26" y="241.0" class="ascii-line" style="animation-delay: 0.40s" xml:space="preserve">              <tspan fill="#d6b4fc">=+++===</tspan><tspan fill="#f8f8f2">:-</tspan><tspan fill="#d6b4fc">+</tspan><tspan fill="#bd93f9">**</tspan><tspan fill="#d6b4fc">=</tspan><tspan fill="#f8f8f2">----</tspan><tspan fill="#d6b4fc">=+</tspan><tspan fill="#bd93f9">**####</tspan><tspan fill="#d6b4fc">+</tspan><tspan fill="#f8f8f2">-::</tspan> </text>
