  <text x="26" y="365.0" class="ascii-line" style="animation-delay: 0.72s" xml:space="preserve">              <tspan fill="#f8f8f2">:</tspan><tspan fill="#bd93f9">*</tspan><tspan fill="#6272a4">@@</tspan><tspan fill="#d6b4fc">+</tspan><tspan fill="#f8f8f2">-</tspan><tspan fill="#d6b4fc">=</tspan><tspan fill="#bd93f9">*</tspan><tspan fill="#6272a4">%@@%%@%</tspan><tspan fill="#bd93f9">##*</tspan><tspan fill="#d6b4fc">++</tspan><tspan fill="#bd93f9">*%</tspan><tspan fill="#6272a4">@@@%</tspan><tspan fill="#f8f8f2">-:::</tspan></text>
  <text x="26" y="380.5" class="ascii-line" style="animation-delay: 0.76s" xml:space="preserve">      <tspan fill="#f8f8f2">:</tspan><tspan fill="#d6b4fc">==</tspan><tspan fill="#bd93f9">*%</tspan><tspan fill="#6272a4">@@%%@@@</tspan><tspan fill="#bd93f9">#</tspan><tspan fill="#f8f8f2">-::-</tspan><tspan fill="#d6b4fc">=++</tspan><tspan fill="#bd93f9">*</tspan><tspan fill="#d6b4fc">*++===+</tspan><tspan fill="#bd93f9">*</tspan><tspan fill="#6272a4">@@@@@</tspan><tspan fill="#bd93f9">#</tspan><tspan fill="#d6b4fc">+=</tspan><tspan fill="#f8f8f2">:</tspan></text>
