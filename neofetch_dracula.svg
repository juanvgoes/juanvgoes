<svg xmlns="http://www.w3.org/2000/svg" width="880" height="465" viewBox="0 0 880 465" fill="none">
  <style>
    .mono {
      font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
    }
    .ascii-line {
      font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
      font-size: 12px;
      opacity: 0;
      animation: fadeIn 0.35s ease-out forwards;
    }
    .info-line {
      font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
      font-size: 13.5px;
      opacity: 0;
      animation: slideIn 0.4s ease-out forwards;
    }
    .palette {
      opacity: 0;
      animation: fadeIn 0.5s ease-out 1.1s forwards;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    .border-glow {
      animation: pulseBorder 4s ease-in-out infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulseBorder {
      0%, 100% { stroke: #44475a; }
      50% { stroke: #bd93f9; }
    }
  </style>

  <!-- Terminal Window -->
  <rect x="4" y="4" width="872" height="457" rx="12" fill="#282a36" stroke="#44475a" stroke-width="2" class="border-glow"/>
  
  <!-- Title Bar -->
  <path d="M4 16 C4 9.373 9.373 4 16 4 H864 C870.627 4 876 9.373 876 16 V40 H4 V16 Z" fill="#21222c"/>
  <line x1="4" y1="40" x2="876" y2="40" stroke="#44475a" stroke-width="1"/>
  
  <!-- Traffic Lights -->
  <circle cx="24" cy="22" r="6" fill="#ff5555"/>
  <circle cx="44" cy="22" r="6" fill="#f1fa8c"/>
  <circle cx="64" cy="22" r="6" fill="#50fa7b"/>
  
  <!-- Title -->
  <text x="440" y="26" text-anchor="middle" fill="#6272a4" class="mono" font-size="12.5px">juanvgoes@github: ~ — neofetch --dracula</text>

  <!-- Command Prompt Top -->
  <text x="26" y="64" class="mono" font-size="13px">
    <tspan fill="#50fa7b" font-weight="bold">❯</tspan>
    <tspan fill="#8be9fd"> neofetch</tspan>
    <tspan fill="#ff79c6"> --theme</tspan>
    <tspan fill="#f1fa8c"> dracula</tspan>
  </text>

